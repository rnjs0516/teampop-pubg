name: 전적 갱신

on:
  workflow_dispatch:        # Actions 탭의 "Run workflow" 버튼 - 폰에서도 누를 수 있습니다
    inputs:
      force:
        description: "새 경기가 없어도 다시 빌드"
        type: boolean
        default: false
  schedule:
    - cron: "5 * * * *"     # 매시 정각 5분. 새 경기가 없으면 호출 1회만 쓰고 바로 끝납니다.

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 전적 수집 및 페이지 생성
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
        run: python build.py ${{ inputs.force && '--force' || '' }}

      - name: 변경분 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "새 경기 없음 - 푸시 생략"
          else
            git commit -m "전적 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git push
          fi
